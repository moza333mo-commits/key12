name: Build LinguaKey APK

"on":
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Extract Bundle & Build LinguaKey APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack LinguaKey-Payload.zip Automatically (Browser Upload Bypass)
        run: |
          if [ -f "LinguaKey-Payload.zip" ]; then
            echo "Found LinguaKey-Payload.zip! Extracting full project structure..."
            unzip -o -q LinguaKey-Payload.zip
            rm -f LinguaKey-Payload.zip
            chmod +x gradlew
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Auto-unpack full LinguaKey v3.0 pure-Java project structure [skip ci]"
              git push origin HEAD:${GITHUB_REF_NAME} || echo "Note: Repo push skipped, continuing build in workspace..."
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build LinguaKey Debug APKs (NoMlKit + MlKit)
        run: ./gradlew assembleNomlkitDebug assembleMlkitDebug --no-daemon --stacktrace

      - name: Collect APKs into Output Folder
        run: |
          mkdir -p dist-apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} dist-apk/ \;
          ls -lh dist-apk/

      - name: Upload LinguaKey APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinguaKey-Installable-APKs
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30
